
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0c1020;
            color: #f4f5ff;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        main {
            width: min(600px, 85%);
            padding: 40px;
            text-align: center;
            background: #151b30;
            border: 1px solid #a78bfa;
            border-radius: 20px;
        }
        h1 { color: #a78bfa; }
        p { color: #b7bfd5; }
        a { color: #7dd3fc; }
    </style>
</head>
<body>
    <main>
        <h1>¡Hola, mundo!</h1>
        <p>Mi nombre es Gianella Solorzano.</p>
        <p>Esta es mi primera página web creada con HTML y CSS.</p>
        <a href="index.html">Volver al inicio</a>
    </main>
</body>
</html>
