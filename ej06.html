
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi espacio creativo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0c1020;
            color: #f4f5ff;
            font-family: Arial, sans-serif;
        }
        .caja {
            width: min(500px, 75%);
            padding: 45px 25px;
            text-align: center;
            border: 2px solid #a78bfa;
            border-radius: 22px;
            background: linear-gradient(135deg, #292448, #16314a);
            transition: box-shadow 0.2s;
        }
        h1 { color: #a78bfa; }
        p { color: #d0d5e8; }
        input {
            width: 80%;
            accent-color: #a78bfa;
            margin: 20px 0;
        }
        a { color: #7dd3fc; }
    </style>
</head>
<body>
    <main class="caja" id="caja">
        <h1>Un mundo de ideas ✨</h1>
        <p>
            La creatividad nos permite imaginar, experimentar
            y construir nuevas posibilidades.
        </p>

        <label for="slider">Ajusta el brillo</label>
        <br>
        <input type="range" id="slider" min="0" max="100" value="50">

        <p>Intensidad: <span id="valor">50%</span></p>
        <a href="index.html">Volver al inicio</a>
    </main>

    <script>
        const slider = document.getElementById("slider");
        const caja = document.getElementById("caja");
        const valor = document.getElementById("valor");

        function cambiarBrillo() {
            const nivel = Number(slider.value);
            valor.textContent = nivel + "%";
            caja.style.boxShadow =
                `0 0 ${nivel}px rgba(167, 139, 250, ${nivel / 100})`;
        }

        slider.addEventListener("input", cambiarBrillo);
        cambiarBrillo();
    </script>
</body>
</html>
