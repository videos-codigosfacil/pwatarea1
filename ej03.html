
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Países y capitales</title>
    <style>
        body {
            margin: 0;
            padding: 50px 15px;
            font-family: Arial, sans-serif;
            background: #0c1020;

        }
        main {
            max-width: 750px;
            margin: auto;
        }
        h1 { color: #a78bfa; }
        table {
            width: 100%;
            border-collapse: collapse;

            margin: 25px 0;

        th, td {
            border: 1px solid #424b68;
            padding: 16px;

        }
